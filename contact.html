        <!-- Main Content-->
        <main class="mb-4">
            <div class="container px-4 px-lg-5">
                <div class="row gx-4 gx-lg-5 justify-content-center">
                    <div class="col-md-10 col-lg-8 col-xl-7">
                        <p>想交流技术、合作项目，或者只是随便聊聊，都可以通过下面的方式找到我：</p>

                        <div class="my-5">
                            <!-- 此表单为前端演示，需接入后台服务才能真正发送 -->
                            <form id="contactForm" data-sb-form-api-token="API_TOKEN">
                                <div class="form-floating">
                                    <input class="form-control" id="name" type="text" placeholder="输入你的姓名..." data-sb-validations="required" />
                                    <label for="name">姓名</label>
                                    <div class="invalid-feedback" data-sb-feedback="name:required">请填写姓名。</div>
                                </div>
                                <div class="form-floating">
                                    <input class="form-control" id="email" type="email" placeholder="输入你的邮箱..." data-sb-validations="required,email" />
                                    <label for="email">邮箱</label>
                                    <div class="invalid-feedback" data-sb-feedback="email:required">请填写邮箱。</div>
                                    <div class="invalid-feedback" data-sb-feedback="email:email">邮箱格式不正确。</div>
                                </div>
                                <div class="form-floating">
                                    <input class="form-control" id="phone" type="tel" placeholder="输入你的电话..." data-sb-validations="required" />
                                    <label for="phone">电话</label>
                                    <div class="invalid-feedback" data-sb-feedback="phone:required">请填写电话。</div>
                                </div>
                                <div class="form-floating">
                                    <textarea class="form-control" id="message" placeholder="在这里输入留言..." style="height: 12rem" data-sb-validations="required"></textarea>
                                    <label for="message">留言</label>
                                    <div class="invalid-feedback" data-sb-feedback="message:required">请填写留言内容。</div>
                                </div>
                                <br />
                                <!-- Submit success message-->
                                <div class="d-none" id="submitSuccessMessage">
                                    <div class="text-center mb-3">
                                        <div class="fw-bolder">留言发送成功！</div>
                                    </div>
                                </div>
                                <!-- Submit error message-->
                                <div class="d-none" id="submitErrorMessage"><div class="text-center text-danger mb-3">发送失败，请稍后再试！</div></div>
                                <!-- Submit Button-->
                                <button class="btn btn-primary text-uppercase disabled" id="submitButton" type="submit">发送</button>
                            </form>
                        </div>
